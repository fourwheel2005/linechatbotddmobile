spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linechatbotddmobile}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      # max = 20 ให้สอดคล้องกับ worker pool ที่ประมวลผลข้อความ (max 20) — แต่ละงานยืม connection แค่สั้นๆ
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: LineChatbotHikariPool
      # 🔎 เตือนใน log ถ้ามี connection ถูกถือค้างเกิน 30 วิ = จับ connection รั่วได้ก่อนพัง
      # (ปกติแต่ละ query คืน connection ใน < 1 วิ — ค่านี้จึงไม่ false alarm ในการทำงานปกติ)
      leak-detection-threshold: 30000
  jpa:
    # ปิด SQL log ใน production — พ่นทุก query เปลือง CPU/ดิสก์ (เปิดชั่วคราวได้ด้วย JPA_SHOW_SQL=true)
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

  # ✅ ย้าย ai มาอยู่ใต้ spring แบบนี้ครับ
  ai:
    openai:
      # ลองใส่ค่า default ไว้กันเหนียวแบบนี้ก่อนก็ได้ครับ
      api-key: ${OPENAI_API_KEY:sk-proj-ใส่คีย์ของคุณตรงนี้}
      chat:
        options:
          model: "gpt-4o-mini"
          temperature: 0.1

line:
  bot:
    channel-token: ${LINE_BOT_CHANNEL_TOKEN}
    channel-secret: ${LINE_BOT_CHANNEL_SECRET}
    handler:
      path: /callback

resilience4j:
  retry:
    instances:
      lineProfile:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignore-exceptions:
          - java.lang.InterruptedException
  circuitbreaker:
    instances:
      lineProfile:
        failure-rate-threshold: 60
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true